<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2>
    <th:block th:if="${petAttribute['new']}" th:text="#{new}">New </th:block>
    Visit
  </h2>

  <b th:text="#{pet}">Pet</b>
  <table class="table table-striped">
    <thead>
      <tr>
        <th th:text="#{name}">Name</th>
        <th th:text="#{birthDate}">Birth Date</th>
        <th th:text="#{type}">Type</th>
        <th th:text="#{owner}">Owner</th>
      </tr>
    </thead>
    <tr>
      <td th:text="${pet.name}"></td>
      <td th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></td>
      <td th:text="${pet.type}"></td>
      <td th:text="${owner?.firstName + ' ' + owner?.lastName}"></td>
    </tr>
  </table>

  <form th:object="petAttribute" class="form-horizontal" method="post">
    <div class="form-group has-feedback">
      <input th:replace="~{fragments/inputField :: input ('Colour', 'colour', 'text')}" />
      <input th:replace="~{fragments/inputField :: input ('Height', 'height', 'text')}" />
       <input th:replace="~{fragments/inputField :: input ('Weight', 'age', 'text')}" />
        <input th:replace="~{fragments/inputField :: input ('Age', 'age', 'text')}" />
    </div>

    <div class="form-group">
      <div class="col-sm-offset-2 col-sm-10">
        <input type="hidden" name="petId" th:value="${pet.id}" />
        <button class="btn btn-primary" type="submit" th:text="#{addPetAttribute}">Add Pet Attribute</button>
      </div>
    </div>
  </form>

  <br />
  <b th:text="#{petAttributes}">PetAttribbute</b>
  <table class="table table-striped">
    <tr>
      <th th:text="#{colour}">Colour</th>
      <th th:text="#{height}">Height</th>
      <th th:text="#{weight}">Weight</th>
      <th th:text="#{age}">Age</th>
    </tr>
    <tr th:if="${!petAttribute['new']}" th:each="visit : ${pet.petAtrribtues}">
      <td th:text="${petAttribute.colour}"></td>
      <td th:text="${petAttribute.height}"></td>
      <td th:text="${petAttribute.weight}"></td>
      <td th:text="${petAttribute.age}"></td>
    </tr>
  </table>

</body>

</html>
